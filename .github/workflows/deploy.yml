name: Deploy

# Builds here, on a GitHub-hosted runner, and pushes the image to GHCR. The
# VPS runs none of this repo's code: the deploy job sends it a tag over SSH,
# and a script that lives on the VPS pulls that image and restarts.
#
# A published release goes to prod. A run by hand goes where it is told.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: 'Where to deploy'
        type: choice
        options: [dev, prod]
        default: dev
      ref:
        description: 'dev: branch, tag or commit. prod: a release tag, such as 1.12.1'
        required: true
        default: 'master'

# Never cancel a running deploy.
concurrency: deploy-${{ inputs.target || 'prod' }}

permissions:
  contents: read

env:
  TARGET: ${{ inputs.target || 'prod' }}
  REF: ${{ inputs.ref || github.event.release.tag_name }}

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.REF }}
          persist-credentials: false

      # prod runs a release tag, dev the commit it was built from.
      - name: Pick the image tag
        id: tag
        run: |
          if [ "$TARGET" = prod ]; then
            echo "tag=$REF" >>"$GITHUB_OUTPUT"
          else
            echo "tag=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ghcr.io/pgoell/website:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to ${{ inputs.target || 'prod' }}
    needs: build
    runs-on: ubuntu-latest
    # Holds the SSH key. The key can do one thing on the VPS: hand a tag to
    # the deploy script for this site.
    environment: vps
    steps:
      - name: Send the tag to the VPS
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_SSH_KEY" >~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$DEPLOY_HOST" "$TARGET $TAG"
